  <text x="135" y="425" class="value">Shri K. Ramesh Bhat S/o Late Shankara Bhat</text>
  <text x="450" y="425" class="value" text-anchor="middle">2-15 (2.375 Ac)</text>
  <text x="535" y="425" class="value">MR No. 46/2018-19</text>

