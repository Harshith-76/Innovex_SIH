  <line x1="40" y1="355" x2="760" y2="355" stroke="#cbd5e1" stroke-width="1" />
  <line x1="120" y1="320" x2="120" y2="500" stroke="#cbd5e1" stroke-width="1" />
  <line x1="380" y1="320" x2="380" y2="500" stroke="#cbd5e1" stroke-width="1" />
  <line x1="520" y1="320" x2="520" y2="500" stroke="#cbd5e1" stroke-width="1" />

