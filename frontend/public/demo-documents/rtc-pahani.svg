  <text x="60" y="730" class="label">DIGITAL SIGNATURE &amp; STAMP:</text>
  <text x="60" y="755" class="value">Digitally Signed by Revenue Inspector / Tahasildar Office, Mangaluru</text>
  <text x="60" y="775" class="value">Verification Hash: 8F92A01C-RTC-2026-KA-DK</text>
  <text x="60" y="795" class="value">Date of Issue: 12-JAN-2026 (Generated via Bhoomi Online Portal)</text>

