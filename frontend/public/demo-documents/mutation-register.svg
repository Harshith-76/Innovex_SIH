<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background-color: #fcfcf9; font-family: Arial, sans-serif;">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-size: 14px; font-weight: bold; fill: #334155; text-anchor: middle; }
    .disclaimer { font-size: 18px; font-weight: bold; fill: #dc2626; text-anchor: middle; }
    .label { font-size: 12px; font-weight: bold; fill: #475569; }
    .value { font-size: 12px; fill: #0f172a; }
    .header-bg { fill: #f1f5f9; stroke: #cbd5e1; }
    .table-border { stroke: #cbd5e1; stroke-width: 1; fill: none; }
    .watermark { font-size: 32px; font-weight: 900; fill: rgba(220, 38, 38, 0.12); text-anchor: middle; }
  </style>

  <rect x="20" y="20" width="760" height="1010" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <rect x="20" y="20" width="760" height="40" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
