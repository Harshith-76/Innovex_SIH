  <text x="60" y="465" class="value">Public 30-day notice issued under Sec 129(2) of Karnataka Land Revenue Act, 1964. No objections received.</text>
  <text x="60" y="485" class="value">Genealogical tree verified by Village Accountant and Revenue Inspector. Mutation certified in Bhoomi DB.</text>

